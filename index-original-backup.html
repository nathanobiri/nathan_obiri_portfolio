<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicheWriter - Digital Storytelling & Content Creation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <svg width="150" height="50" viewBox="0 0 150 50" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="url(#logo-gradient)">NicheWriter</text>
                </svg>
            </div>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#articles">Articles</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <div class="auth-buttons">
                <button class="contact-btn">Contact Me</button>
            </div>
        </nav>
    </header>

    <main>
        <section id="hero" class="hero">
            <div class="hero-content">
                <div class="hero-tagline">
                    <span class="highlight">Content Creator</span>
                    <span class="highlight">Storyteller</span>
                    <span class="highlight">Digital Marketer</span>
                </div>
                <h1 class="typewriter">Crafting <span class="text-gradient">Impactful Stories</span> for the Digital World</h1>
                <p class="hero-subtitle">Transforming complex ideas into engaging narratives that connect, inspire, and drive action.</p>
                <div class="hero-buttons">
                    <a href="#articles" class="cta-button primary">Explore My Work</a>
                    <a href="#contact" class="cta-button secondary">Let's Work Together</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
