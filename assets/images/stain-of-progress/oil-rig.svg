<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="600" fill="#87CEEB"/>
    
    <!-- Oil Rig -->
    <rect x="350" y="200" width="100" height="300" fill="#2F4F4F"/>
    <rect x="350" y="200" width="10" height="300" fill="#000000"/>
    <rect x="440" y="200" width="10" height="300" fill="#000000"/>
    
    <!-- Oil Spill -->
    <circle cx="400" cy="500" r="50" fill="rgba(0,0,0,0.3)"/>
    <circle cx="400" cy="500" r="100" fill="rgba(0,0,0,0.2)"/>
    <circle cx="400" cy="500" r="150" fill="rgba(0,0,0,0.1)"/>
    
    <!-- Waves -->
    <path d="M0,500 Q100,480 200,500 Q300,480 400,500 Q500,480 600,500 Q700,480 800,500" stroke="#000000" stroke-width="2" fill="none"/>
    <path d="M0,520 Q100,500 200,520 Q300,500 400,520 Q500,500 600,520 Q700,500 800,520" stroke="#000000" stroke-width="2" fill="none"/>
</svg>
